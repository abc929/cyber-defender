<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="Cyber Defender Obby — a free browser platformer that teaches kids cybersecurity: passwords, phishing, two-factor authentication, privacy, malware, updates, online strangers, and encryption.">
<title>Cyber Defender Obby</title>
<style>
:root{
  color-scheme: dark;
  --bg:#070b16; --bg2:#0d1428; --panel:#111a30; --panel2:#182444; --line:#23325a;
  --text:#e8f0ff; --muted:#9fb0d0; --accent:#38e1ff; --accent2:#7c5cff; --good:#3ddc84; --bad:#ff5470; --gold:#ffcc4d;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;width:960px;height:540px;transform-origin:center center;background:var(--bg2);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
canvas{display:block;width:960px;height:540px}

/* HUD */
#hud{position:absolute;inset-block-start:0;inset-inline:0;display:flex;gap:8px;align-items:center;padding:8px 10px;pointer-events:none;font-size:13px;font-weight:600}
#hud .chip{background:rgba(8,12,26,.72);border:1px solid var(--line);border-radius:999px;padding:5px 10px;backdrop-filter:blur(6px);white-space:nowrap}
#hud .grow{flex:1;text-align:center;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud button{pointer-events:auto;cursor:pointer;background:rgba(8,12,26,.72);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 10px;font:inherit;font-weight:700}
#hud button:hover{border-color:var(--accent)}

/* Toast */
#toast{position:absolute;inset-inline:0;inset-block-end:92px;display:flex;justify-content:center;pointer-events:none}
#toast span{background:rgba(8,12,26,.9);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;max-width:80%;text-align:center}
#toast.show span{opacity:1;transform:translateY(0)}

/* Touch controls */
#touch{position:absolute;inset-inline:0;inset-block-end:0;display:none;justify-content:space-between;padding:14px;pointer-events:none}
#touch.on{display:flex}
#touch .grp{display:flex;gap:12px}
#touch button{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(20,30,60,.55);color:var(--text);font-size:28px;font-weight:800;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px)}
#touch button:active,#touch button.down{background:rgba(56,225,255,.35);border-color:var(--accent)}

/* Rotate hint (small portrait screens) */
#rotate{display:none;position:absolute;inset-inline:0;inset-block-start:46px;text-align:center;font-weight:700;font-size:26px;padding:10px;background:rgba(8,12,26,.85);pointer-events:none}
@media (orientation: portrait) and (max-width: 820px){#rotate{display:block}}

/* Overlay */
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,18,.72);backdrop-filter:blur(3px);padding:18px}
#overlay.show{display:flex}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;max-width:600px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--shadow);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.card:focus{outline:none}
.card h1{margin:0 0 6px;font-size:30px;letter-spacing:.5px}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:14px 0 6px;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.card p{margin:6px 0;line-height:1.45;color:var(--text)}
.card .muted{color:var(--muted);font-size:14px}
.card .kicker{display:inline-block;background:rgba(56,225,255,.12);color:var(--accent);border:1px solid rgba(56,225,255,.35);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-block-end:8px}
.card .kicker.bad{background:rgba(255,84,112,.12);color:var(--bad);border-color:rgba(255,84,112,.4)}
.card .kicker.good{background:rgba(61,220,132,.12);color:var(--good);border-color:rgba(61,220,132,.4)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-block-start:16px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-weight:700;font-size:15px;padding:11px 16px;border-radius:12px;transition:transform .08s,border-color .15s;text-align:start}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06101f;border:none}
.btn.ghost{background:transparent}
.btn.block{flex:1 1 100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.opts{display:grid;gap:10px;margin-block-start:12px}
.opts .btn{font-size:16px;padding:14px 16px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bubble{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.35;font-size:15px}
.bubble.them{align-self:flex-start;background:#26325a;border-end-start-radius:4px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#1e9bd2,#7c5cff);border-end-end-radius:4px}
.bubble .who{display:block;font-size:11px;color:var(--muted);margin-block-end:3px;font-weight:700;letter-spacing:.5px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1 1 120px;background:rgba(8,12,26,.5);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.progress{height:12px;background:rgba(8,12,26,.6);border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:12px 0}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));animation:fill 1.6s linear forwards}
@keyframes fill{to{width:100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-block-start:10px}
.grid .btn{display:flex;flex-direction:column;gap:2px;font-size:14px}
.grid .btn small{color:var(--muted);font-weight:500}
input.name{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(8,12,26,.6);color:var(--text);width:100%}
table.lb{width:100%;border-collapse:collapse;font-size:14px;margin-block-start:8px}
table.lb td,table.lb th{padding:6px 8px;border-block-end:1px solid var(--line);text-align:start}
table.lb th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.guide .stage{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-block-start:10px;background:rgba(8,12,26,.35)}
.guide .stage b{color:var(--accent)}
.controls{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-block-start:8px}
.controls kbd{background:rgba(8,12,26,.7);border:1px solid var(--line);border-block-end-width:3px;border-radius:6px;padding:2px 8px;font-family:inherit;font-weight:800;font-size:13px}

/* Print document (certificate / facilitator guide) */
#printdoc{display:none}
@media print{
  body{background:#fff;color:#111;display:block;overflow:visible}
  #stage{display:none}
  #printdoc{display:block;padding:24px;font-family:Georgia,"Times New Roman",serif;color:#111}
  #printdoc .frame{border:6px double #1b3a6b;padding:28px 36px;border-radius:12px}
  #printdoc .cert{text-align:center;padding:40px}
  #printdoc h1{font-size:40px;margin:0 0 6px;letter-spacing:2px;color:#1b3a6b}
  #printdoc h2{font-size:22px;margin:18px 0 6px}
  #printdoc h2 small{font-size:14px;color:#555;font-weight:normal}
  #printdoc .name{font-size:38px;margin:16px 0;color:#1b3a6b;border-block-end:2px solid #1b3a6b;display:inline-block;padding:0 30px 6px}
  #printdoc p{font-size:15px;margin:6px 0;line-height:1.4}
  #printdoc .cert p{font-size:18px}
  #printdoc .small{font-size:14px;color:#555}
  #printdoc .badges{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-block-start:16px}
  #printdoc .badges span{border:1px solid #1b3a6b;border-radius:999px;padding:4px 12px;font-size:13px}
  #printdoc .pstage{border-block-start:1px solid #ccc;padding-block-start:6px;margin-block-start:10px;break-inside:avoid}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540" aria-label="Cyber Defender Obby game" role="img"></canvas>
  <div id="hud">
    <span class="chip" id="hud-stage">Stage 1</span>
    <span class="grow" id="hud-goal"></span>
    <span class="chip" id="hud-items"></span>
    <span class="chip" id="hud-falls">💥 0</span>
    <span class="chip" id="hud-time">⏱ 0:00</span>
    <button id="hud-menu" type="button" aria-label="Menu">☰</button>
  </div>
  <div id="toast" aria-live="polite"><span id="toast-text"></span></div>
  <div id="touch">
    <div class="grp"><button type="button" id="t-left" aria-label="Move left">◀</button><button type="button" id="t-right" aria-label="Move right">▶</button></div>
    <div class="grp"><button type="button" id="t-jump" aria-label="Jump">⤒</button></div>
  </div>
  <div id="overlay" role="dialog" aria-modal="true"><div class="card" id="card" tabindex="-1"></div></div>
  <div id="rotate">📱 Turn your device sideways (landscape) for the best view</div>
</div>
<div id="printdoc"></div>
<script>
'use strict';
/* =====================================================================
   CYBER DEFENDER OBBY — a free, single-file browser game
   ---------------------------------------------------------------------
   ✏️  EDIT HERE: everything the game SAYS lives in the CONTENT block
   below — stage names, quiz questions, answers, tips, fact cards and
   the facilitator guide. Change the words, save the file, refresh.
   `answer` is the index (0, 1 or 2) of the correct option.
   ===================================================================== */
const CONTENT = {
  title: 'Cyber Defender Obby',
  tagline: 'Run, jump, and outsmart the hackers — 8 stages of cybersecurity.',
  credit: 'Cloudberry Academy',
  stages: [
    {
      name: 'Password Gate', concept: 'Strong passwords',
      objective: 'Learn the moves, cross the pit, then pick the STRONGEST password door.',
      gate: {
        question: 'Which password is the STRONGEST?',
        options: ['gabby123', 'Purple!Tiger$Runs42', 'password2026'], answer: 1,
        tip: 'Long + a mix of letters, numbers and symbols + nothing about YOU = strong. Names, birthdays and "password" are the first things hackers try.'
      },
      fact: 'Strong passwords are long (12+ characters), mix letters, numbers and symbols, and never use personal info like your name or birthday. A passphrase like "Purple!Tiger$Runs42" is easy for you to remember and very hard to crack. Use a different password for every account — a password manager can remember them for you.',
      debrief: 'What makes a password strong? Why is "gabby123" a bad idea even though it is easy to remember?',
      home: 'Make a passphrase together from 3 random words + a number + a symbol. Practice typing it — then never share it.'
    },
    {
      name: 'Phishing Bridge', concept: 'Spotting phishing',
      objective: 'Phishy messages RUSH you or promise PRIZES. Step only on real messages — phishy planks crumble!',
      gate: {
        question: 'Which message is PHISHING?',
        options: ['Library: your book is due Friday.', 'URGENT! Your account will be deleted — click here NOW to verify!', 'Coach: practice moved to 4pm.'], answer: 1,
        tip: 'Phishing rushes you ("NOW!"), threatens you ("deleted!") or promises prizes. Real companies never ask for your password in a message.'
      },
      fact: 'Phishing is a fake message designed to trick you into clicking a link or giving away information. Red flags: urgency, threats, prizes, strange spelling, senders you do not know, and links you did not ask for. When in doubt, do not click — show a trusted adult.',
      debrief: 'Which planks crumbled? What did those messages have in common?',
      home: 'Look at a real email or text together and hunt for red flags. Talk about what to do if a "prize" message arrives.'
    },
    {
      name: 'Two-Factor Tower', concept: 'Two-factor authentication (2FA/MFA)',
      objective: 'Remember the CODE on the sign (something you KNOW), climb for the KEY CARD (something you HAVE), then unlock the vault.',
      gate: {
        question: 'The vault needs BOTH factors. Enter the code from the sign:',
        options: ['4471', '4417', '7144'], answer: 0,
        tip: 'Two-factor authentication = something you KNOW (a code or password) + something you HAVE (a key, phone or fingerprint). The code was 4471.'
      },
      noKeyTip: '🔒 Locked! A code alone is only ONE factor. Climb the tower and grab the KEY CARD first.',
      fact: 'Two-factor authentication (also called 2FA or MFA) means a password PLUS a second proof — a code on your phone, a security key, or a fingerprint. Even if a hacker steals your password, they still cannot get in. Turn it on for games, email and social accounts.',
      debrief: 'What were the two "factors" in this stage? Why is having two better than one?',
      home: 'Turn on two-factor authentication for one family account (Xbox, Roblox, email) together.'
    },
    {
      name: 'Oversharing Maze', concept: 'Personal information & privacy',
      objective: 'Collect what is SAFE to share. Jump over PRIVATE info — strangers can find you with it!',
      gate: {
        question: 'Which is SAFE to share with online friends?',
        options: ['Your home address', 'The name of your school', 'Your favorite video game'], answer: 2,
        tip: 'Anything that helps a stranger find you in real life stays private: address, school, full name, birthday, phone number and photos that show where you are.'
      },
      privateTip: 'That was PRIVATE information! Strangers can put small clues together like a puzzle to find you. Keep your address, school, birthday and phone number offline.',
      fact: 'Personal information is like a puzzle — strangers can put small pieces together. Keep your address, school, birthday, phone number, passwords and location private. Favorite games, hobbies and colors are fine to share.',
      debrief: 'Why is the name of your school private? What could someone do with it?',
      home: 'Check the privacy settings on one game or app together — who can see the profile, and what does it show?'
    },
    {
      name: 'Malware Lava Field', concept: 'Malware & safe downloads',
      objective: 'Only OFFICIAL downloads are safe. "Free Robux" files are MALWARE — touch one and it is game over!',
      gate: {
        question: 'Which download is SAFE?',
        options: ['FreeRobux_Generator.exe from a pop-up', 'The game\'s official update from the App Store', 'UnlockAllSkins.zip from a stranger in chat'], answer: 1,
        tip: '"Free Robux", "free V-Bucks" and "unlock all skins" downloads are how malware spreads. Only download from official app stores and trusted sites.'
      },
      malwareTip: '☠ That was MALWARE! "Free" downloads from pop-ups and strangers steal passwords or lock your files.',
      fact: 'Malware is software made to harm you — it can steal passwords, spy through your camera, or lock your files until you pay (ransomware). It hides inside "free" downloads, cracked games and pop-ups. Only install from official app stores, and ask before downloading anything new.',
      debrief: 'What made the fake downloads tempting? How can you tell an official source from a fake one?',
      home: 'Show where the official app store is on your device and how to check who made an app before installing it.'
    },
    {
      name: 'Update Elevator', concept: 'Software updates',
      objective: 'The elevator is buggy and an update is waiting. Find the panel and choose wisely.',
      gate: {
        question: 'Why install updates QUICKLY?',
        options: ['They fix security holes that hackers use', 'They make the game harder', 'Updates are just for new emojis'], answer: 0,
        tip: 'Updates patch the security holes hackers already know about. "Remind me later" leaves the door open for them.'
      },
      fact: 'Software updates fix bugs — including security holes. Hackers race to attack devices that have not updated yet. Turning on automatic updates for your phone, tablet, games and apps closes those doors before anyone can use them.',
      debrief: 'What happened when you chose "Remind me later"? Why do companies release updates so often?',
      home: 'Check for updates on one device together and turn on automatic updates.'
    },
    {
      name: 'Chat Room', concept: 'Strangers online',
      objective: 'A stranger wants to chat. Watch for red flags, then choose how to respond.',
      gate: {
        question: 'A stranger online asks where you go to school. You should…',
        options: ['Tell them — they seem nice', 'Make up a fake school', 'Do not answer, block & report, and tell a trusted adult'], answer: 2,
        tip: 'People online are not always who they say they are. Never share personal info, use Block and Report, and tell a trusted adult — that is never "tattling".'
      },
      fact: 'People online are not always who they say they are. Never share passwords or personal information, never agree to meet someone from online, and never keep an online chat secret from your family. Block and Report buttons exist for you — use them, then tell a trusted adult.',
      debrief: 'What were the red flags in the stranger\'s messages? Who is a trusted adult you would tell?',
      home: 'Find the Block and Report buttons together in one game or app your child uses.'
    },
    {
      name: 'Encryption Vault', concept: 'Encryption',
      objective: 'The vault code is ENCRYPTED. Shift each letter back 3 to decode it, then pick the right door.',
      gate: {
        question: 'Decoded the message? Pick the vault door with the right color.',
        options: ['RED', 'BLUE', 'GREEN'], answer: 1,
        tip: 'Shift each letter back 3: F→C, R→O, G→D, H→E … "FRGH LV EOXH" becomes "CODE IS BLUE".'
      },
      cipher: 'FRGH LV EOXH',
      fact: 'Encryption scrambles a message so only someone with the key can read it. Your chats, games and online shopping are protected by encryption every day — that is what the 🔒 padlock in your browser means. Caesar\'s letter shift is 2,000 years old; modern encryption uses giant math keys that would take computers billions of years to guess.',
      debrief: 'How did you decode the message? Why do we want our messages encrypted?',
      home: 'Write each other secret notes with a shift cipher, then find the padlock icon on a website together.'
    }
  ],
  keypad: { title: 'Vault Keypad', noKeyToast: '🔒 Locked. You need the KEY CARD (something you HAVE) — climb the tower!' },
  update: {
    title: 'Update available',
    body: 'Elevator OS 2.4 fixes a security bug that lets hackers control the elevator. Install now?',
    yes: 'Update now', later: 'Remind me later',
    laterMsgs: ['The bug is still there… and so is the hacker. The elevator does not move.', 'Still buggy. Hackers love devices that "remind me later".', 'Hint: every day you wait is a day hackers already know about the hole.'],
    installing: 'Installing update…', done: '✅ Patched! The elevator works again.'
  },
  chat: {
    npc: 'xX_Ninja_9000',
    messages: ['hey ur really good at this game!! 😎', 'i can give u 10,000 FREE coins 🤑 but the site needs ur password', 'also what school do u go to? maybe we can meet up 👀', 'dont tell ur parents, its a secret deal just for u'],
    options: ['Sure! My password is…', 'Block, report, and tell a trusted adult', 'Ask them what THEY get out of it first'], answer: 1,
    wrongTip: 'Red flags: FREE stuff, asking for your PASSWORD, asking about your SCHOOL, and "keep it secret". Anyone doing that — even a "friend" — gets blocked and reported. Then tell a trusted adult.',
    success: '🛡 Blocked & reported. You told a trusted adult — the barrier opens!'
  },
  signs: {
    controls: 'Welcome, Defender! Move with ← → (or A D). Jump with SPACE or ↑. On a tablet, use the buttons.',
    doors: 'Walk into a door and press JUMP (⤒) to choose it. Wrong door = back to the checkpoint, so read first!'
  },
  win: {
    title: 'Cyber Defender!',
    body: 'You beat all 8 stages. You now know more about staying safe online than most grown-ups.'
  }
};

/* ===================== PHYSICS (tuned; tests depend on these) ===================== */
const PH = { W: 960, H: 540, GRAV: 0.55, JUMP: 11.5, SPEED: 4.2, MAXFALL: 15, COYOTE: 7, PW: 28, PHH: 40, GY: 500, STEP: 1 / 60 };

/* ===================== LEVEL BUILDER ===================== */
let _id = 0;
function builder() {
  const L = { w: 0, plats: [], hazards: [], checkpoints: [], items: [], signs: [], npcs: [], panels: [], minigates: [], gate: null, spawn: { x: 60, y: PH.GY - PH.PHH }, route: [] };
  let cx = 0;
  function addPlat(x, y, w, h, o) {
    const p = Object.assign({ id: ++_id, x, y, w, h, kind: 'solid', label: null, route: true }, o || {});
    if (p.kind === 'moving') { p.baseY = y; p.range = p.range || 25; p.speed = p.speed || 0.03; p.phase = p.phase || 0; p.active = p.active !== false; p.prevY = y; }
    if (p.kind === 'crumble') { p.state = 'ok'; p.timer = 0; }
    L.plats.push(p);
    if (p.route && p.kind !== 'kill' && !(p.kind === 'crumble' && p.phish)) L.route.push(p.id);
    return p;
  }
  const B = {
    x: () => cx,
    ground(w, o) { o = o || {}; const y = o.y == null ? PH.GY : o.y; const p = addPlat(cx, y, w, PH.H - y + 40, Object.assign({ ground: true }, o)); cx += w; return p; },
    gap(w) { cx += w; },
    lava(w) { L.hazards.push({ x: cx, y: PH.GY + 14, w, h: 60, kind: 'lava' }); cx += w; },
    plat(w, y, o) { const p = addPlat(cx, y, w, (o && o.h) || 18, o); cx += w; return p; },
    at(x, y, w, o) { return addPlat(x, y, w, (o && o.h) || 18, Object.assign({ route: false }, o)); },
    checkpoint(x) { L.checkpoints.push({ x, y: PH.GY, hit: false }); },
    sign(x, text, o) { L.signs.push(Object.assign({ x, y: PH.GY, text }, o || {})); },
    item(x, y, o) { L.items.push(Object.assign({ x, y, r: 13, got: false }, o)); },
    npc(x, o) { L.npcs.push(Object.assign({ x, y: PH.GY, resolved: false, cooldown: 0 }, o)); },
    panel(x, o) { L.panels.push(Object.assign({ x, y: PH.GY, used: false }, o)); },
    minigate(o) { // two doors on a 250px ground segment; the barrier opens when the REAL message is chosen
      const x = cx; const labels = o.realFirst ? [o.real, o.phish] : [o.phish, o.real];
      const mg = { x, w: 250, solved: false, tip: o.tip, question: o.question || 'Which message is REAL? Enter that door.', doors: [] };
      mg.doors = labels.map((label, i) => ({ label, i, ok: label === o.real, mg, x: x + 40 + i * 100, y: PH.GY - 100, w: 70, h: 100, open: 0 }));
      mg.barrier = addPlat(x + 215, 300, 20, 200, { kind: 'barrier', route: false, label: 'READ FIRST', mg });
      L.minigates.push(mg);
      L.checkpoints.push({ x: x + 12, y: PH.GY, hit: false });
      B.ground(250);
      return mg;
    },
    gate(o) { // doors sit on the ground at cx; wall runs to the level end
      const doors = o.labels.map((label, i) => ({ label, i, x: cx + 30 + i * 100, y: PH.GY - 100, w: 70, h: 100, open: 0 }));
      const w = 30 + o.labels.length * 100 + 40;

  function showGuide() {

  function addHall(name) { const s = G.save; s.hall = (s.hall || []).concat([{ name, time: Math.round(G.time), deaths: G.deaths, date: new Date().toISOString().slice(0, 10) }]).sort((a, b) => a.time - b.time || a.deaths - b.deaths).slice(0, 5); writeSave(s); }
  function printCertificate(name) {

  /* ---- stage-specific overlays ---- */
  function openKeypad() {
    const st = CONTENT.stages[G.stage], g = st.gate;
    let html = '<span class="kicker">' + esc(CONTENT.keypad.title) + '</span><h2>🔑 Key card accepted — factor 1 of 2</h2><p>' + esc(g.question) + '</p><div class="opts">';

    html += '</div>';
    showOverlay(html, { pick: (b) => { const i = +b.getAttribute('data-i'); if (i === g.answer) { hideOverlay('playing'); stageClear(G.L.gate.doors[0]); } else { hideOverlay('playing'); wrongAnswer(g.tip); } } });
  }
  function openUpdate(panel) {
    const U = CONTENT.update;
    const render = (msg) => {
      let html = '<span class="kicker">System message</span><h2>⬇ ' + esc(U.title) + '</h2><p>' + esc(U.body) + '</p>' + (msg ? '<p class="muted">⚠ ' + esc(msg) + '</p>' : '');
      html += '<div class="btns"><button class="btn primary" data-act="yes">' + esc(U.yes) + '</button><button class="btn" data-act="later">' + esc(U.later) + '</button><button class="btn ghost" data-act="walk">Walk away</button></div>';
      showOverlay(html, {
        yes: () => { dom.card.innerHTML = '<h2>⬇ ' + esc(U.installing) + '</h2><div class="progress"><i></i></div><p class="muted">Closing the hole before the hackers use it…</p>'; setTimeout(() => { panel.used = true; const el = G.L.plats.find((q) => q.elevator); el.active = true; el.t0 = G.tick; hideOverlay('playing'); toast(U.done, 3000); }, 1700); },
        later: () => { const m = U.laterMsgs[Math.min(G.laterCount++, U.laterMsgs.length - 1)]; render(m); },
        walk: () => hideOverlay('playing')
      });
    };
    render(null);
  }
  function openChat(npc) {
    const C = CONTENT.chat;
    let html = '<span class="kicker">Game chat</span><h2>💬 ' + esc(C.npc) + ' wants to chat</h2><div class="chat">';
    C.messages.forEach((m) => { html += '<div class="bubble them"><span class="who">' + esc(C.npc) + '</span>' + esc(m) + '</div>'; });
    html += '</div><p class="muted">How do you reply?</p><div class="opts">';
    C.options.forEach((o, i) => { html += '<button class="btn" data-act="pick" data-i="' + i + '">' + esc(o) + '</button>'; });
    html += '</div>';
    showOverlay(html, { pick: (b) => {
      const i = +b.getAttribute('data-i');
      if (i === C.answer) { npc.resolved = true; for (const q of G.L.plats) if (q.kind === 'barrier') q.openBarrier = true; hideOverlay('playing'); toast(C.success, 3200); burst(820, 400, '#3ddc84', 40); }
      else { npc.cooldown = 120; showTip('Red flags!', 'Not the safest reply', C.wrongTip, 'Try again'); }
    } });
  }

  /* ---- stage flow ---- */
  function startStage(i) {
    G.stage = i; G.L = buildLevel(i); G.p = newPlayer(G.L.spawn.x, G.L.spawn.y); G.cp = { x: G.L.spawn.x, y: G.L.spawn.y };
    G.stageDeaths = 0; G.stageTime = 0; G.stageTokens = 0; G.laterCount = 0; G.particles = []; G.cam = 0; G.deadModal = null;
    for (const q of G.L.plats) if (q.kind === 'moving') { q.y = movingY(q, G.tick); q.prevY = q.y; }
    const st = CONTENT.stages[i];
    dom.hudStage.textContent = (i + 1) + '/' + CONTENT.stages.length + ' · ' + st.name; dom.hudGoal.textContent = st.objective; updateHud();
    showIntro(i);
  }
  function die(reason, item) {
    if (G.state !== 'playing') return;
    G.state = 'dead'; G.deadTimer = 42; G.deaths++; G.stageDeaths++; G.flash = 1;
    burst(G.p.x + G.p.w / 2, G.p.y + G.p.h / 2, reason === 'malware' ? '#ff5470' : '#38e1ff', 26);
    const st = CONTENT.stages[G.stage];
    G.deadModal = null;
    if (reason === 'private') G.deadModal = ['Oversharing!', 'You shared: ' + item.label, st.privateTip];
    else if (reason === 'malware') toast(st.malwareTip || '☠ Malware!', 3000);
    else if (reason === 'phish') toast('🎣 That plank was PHISHING — it rushed you. Read before you step!', 3000);
    else if (reason === 'lava') toast('🔥 Ouch! Back to the checkpoint.', 1600);
    else if (reason === 'void') toast('💨 Whoops! Back to the checkpoint.', 1400);
    updateHud();
  }
  function respawn() {
    const p = G.p; p.x = G.cp.x; p.y = G.cp.y; p.vx = p.vy = 0; p.standing = null; p.dwell = 0; p.deathHint = null; p.prevCx = null;
    for (const q of G.L.plats) if (q.kind === 'crumble') { q.state = 'ok'; q.timer = 0; }
    G.state = 'playing';
  }
  function wrongAnswer(tip) {
    if (G.state !== 'playing') return;
    G.state = 'dead'; G.deadTimer = 30; G.deaths++; G.stageDeaths++; G.flash = 1; G.deadModal = ['Not quite', 'Wrong door!', tip];
    burst(G.p.x + G.p.w / 2, G.p.y + G.p.h / 2, '#ff5470', 20); updateHud();
  }
  function stageClear(door) { G.state = 'clearing'; G.clearTimer = 70; G.clearDoor = door; burst(door.x + door.w / 2, door.y + 20, '#ffcc4d', 60); }
  function onInteract(t) {
    if (G.L.panels.indexOf(t) >= 0) return openUpdate(t);
    if (t.mg) {
      if (t.ok) { t.mg.solved = true; t.mg.barrier.openBarrier = true; t.open = 1; burst(t.x + t.w / 2, t.y + 30, '#3ddc84', 30); toast('✅ Real message — the way opens!', 2000); }
      else wrongAnswer(t.mg.tip);
      return;
    }
    const gate = G.L.gate;
    if (gate.type === 'keypad') { if (!G.p.hasKey) { if (G.noKeyCooldown <= 0) { toast(CONTENT.keypad.noKeyToast, 2600); G.noKeyCooldown = 120; } G.p.dwell = 0; return; } return openKeypad(); }
    if (t.i === CONTENT.stages[G.stage].gate.answer) stageClear(t); else wrongAnswer(CONTENT.stages[G.stage].gate.tip);
  }
  function burst(x, y, color, n) { for (let i = 0; i < n; i++) G.particles.push({ x, y, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.9) * 9, life: 40 + Math.random() * 30, color, r: 2 + Math.random() * 3 }); }
  function updateHud() {
    const p = G.p; let items = '';
    if (p && p.hasKey) items += '🔑 ';
    const total = G.L ? G.L.items.filter((it) => it.kind === 'safe').length : 0;
    if (total) items += '⭐ ' + G.stageTokens + '/' + total;
    dom.hudItems.textContent = items.trim(); dom.hudItems.style.display = items ? '' : 'none';
    dom.hudFalls.textContent = '💥 ' + G.deaths; dom.hudTime.textContent = '⏱ ' + fmt(G.time);
  }

  /* ---- main loop ---- */
  const hooks = { die, interact: onInteract, chat: openChat, collect: (it) => { toast(it.kind === 'key' ? '🔑 Key card! Now find the vault keypad.' : '⭐ Safe to share: ' + it.label, 1800); burst(it.x, it.y, '#ffcc4d', 14); updateHud(); }, checkpoint: () => toast('🚩 Checkpoint!', 1000) };
  let last = performance.now(), acc = 0, hudTick = 0;
  function update() {
    if (G.noKeyCooldown > 0) G.noKeyCooldown--;
    if (G.state === 'playing') { G.time += PH.STEP; G.stageTime += PH.STEP; physicsStep(G, input, hooks); }
    else if (G.state === 'dead') { if (--G.deadTimer <= 0) { if (G.deadModal) { const m = G.deadModal; G.deadModal = null; respawn(); showTip(m[0], m[1], m[2], 'Try again'); } else respawn(); } }
    else if (G.state === 'clearing') { G.clearDoor.open = Math.min(1, G.clearDoor.open + 0.02); if (--G.clearTimer <= 0) showFactCard(); }
    for (const q of G.particles) { q.x += q.vx; q.y += q.vy; q.vy += 0.25; q.life--; }
    G.particles = G.particles.filter((q) => q.life > 0);
    if (G.flash > 0) G.flash -= 0.05;
    if (G.L && G.p) { const target = Math.max(0, Math.min(G.L.w - PH.W, G.p.x - PH.W * 0.38)); G.cam += (target - G.cam) * 0.15; }
    if (++hudTick % 30 === 0 && G.state === 'playing') updateHud();
  }
  function frame(now) {
    let dt = (now - last) / 1000; last = now; if (dt > 0.25) dt = 0.25; acc += dt;
    while (acc >= PH.STEP) { update(); acc -= PH.STEP; }
    render(ctx, G);
    requestAnimationFrame(frame);
  }
  showTitle(false);
  requestAnimationFrame(frame);
}

/* ===================== SAVE ===================== */
const SAVE_KEY = 'cyber-defender-obby-v1';
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); return { unlocked: s.unlocked || 0, hall: s.hall || [], run: s.run || null }; } catch (_) { return { unlocked: 0, hall: [], run: null }; } }
function writeSave(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (_) { /* private mode: ignore */ } }

/* ===================== RENDER ===================== */
const COLORS = { plat: '#1b2d52', platTop: '#38e1ff', platEdge: '#2a4478', ground: '#152547', tile: '#22386a', safe: '#136a6e', safeTop: '#3ddc84', kill: '#4a1020', killEdge: '#ff5470', gold: '#ffcc4d', text: '#e8f0ff', muted: '#9fb0d0' };

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines;
}
function fitFont(ctx, text, maxW, px, minPx) {
  for (let s = px; s >= minPx; s--) { ctx.font = 'bold ' + s + 'px system-ui, sans-serif'; if (ctx.measureText(text).width <= maxW) return s; }
  return minPx;
}
function pill(ctx, text, cx, cy, opts) {
  opts = opts || {}; const px = opts.px || 11, maxW = opts.maxW || 150, maxLines = opts.maxLines || 3;
  let size = px; ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
  let lines = wrapText(ctx, text, maxW);
  while (size > 8 && (lines.length > maxLines || lines.some((l) => ctx.measureText(l).width > maxW))) { size--; ctx.font = 'bold ' + size + 'px system-ui, sans-serif'; lines = wrapText(ctx, text, maxW); }
  const lh = size + 3, w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 14, h = lines.length * lh + 6;
  const x = cx - w / 2, y = cy - h / 2;
  ctx.fillStyle = opts.bg || 'rgba(6,10,24,0.88)'; roundRect(ctx, x, y, w, h, 7); ctx.fill();
  if (opts.border) { ctx.strokeStyle = opts.border; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.fillStyle = opts.color || COLORS.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, cx, y + 3 + lh / 2 + i * lh));
  return { x, y, w, h };
}

function render(ctx, G) {
  const W = PH.W, H = PH.H, t = G.tick;
  ctx.setTransform(G.scale, 0, 0, G.scale, 0, 0);
  const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#0b1533'); grad.addColorStop(1, '#050815');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  drawBackdrop(ctx, G);
  if (!G.L || !G.p) return;
  const L = G.L, p = G.p, cam = Math.round(G.cam);
  ctx.save(); ctx.translate(-cam, 0);
  const vis = (x, w) => x + w > cam - 40 && x < cam + W + 40;
  // hazards
  for (const h of L.hazards) if (vis(h.x, h.w)) drawLava(ctx, h, t);
  // gate walls
  for (const mg of L.minigates) if (vis(mg.x, mg.w)) drawMinigate(ctx, mg);
  if (L.gate) drawGate(ctx, L, G);
  // platforms
  for (const q of L.plats) if (vis(q.x, q.w)) drawPlat(ctx, q, t, p);
  // checkpoints, signs, panels, npcs, items
  for (const c of L.checkpoints) if (vis(c.x - 10, 40)) drawCheckpoint(ctx, c, t);
  for (const s of L.signs) if (vis(s.x - 20, 40)) drawSignPost(ctx, s);
  for (const pn of L.panels) if (vis(pn.x - 30, 60)) drawPanel(ctx, pn, t);
  for (const n of L.npcs) if (vis(n.x - 30, 60)) drawNpc(ctx, n, t);
  for (const it of L.items) if (!it.got && vis(it.x - 20, 40)) drawItem(ctx, it, t);
  // player
  if (G.state !== 'dead') drawPlayer(ctx, p, t);
  // particles
  for (const q of G.particles) { ctx.globalAlpha = Math.max(0, Math.min(1, q.life / 30)); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // sign bubbles (top layer)
  for (const s of L.signs) if (Math.abs(p.x + p.w / 2 - s.x) < 120) drawBubble(ctx, s, cam);
  // 'press jump' hint when standing in a door or at a panel
  if (p.dwellTarget && p.dwell > 12 && G.state === 'playing') {
    const isPanel = L.panels.indexOf(p.dwellTarget) >= 0;
    pill(ctx, isPanel ? 'Press JUMP ⤒ to open the panel' : 'Press JUMP ⤒ to enter this door', p.x + p.w / 2, p.y - 22, { px: 12, border: COLORS.gold, bg: 'rgba(20,28,60,0.98)', maxW: 200 });
  }
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,84,112,' + (G.flash * 0.45).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
}

function drawBackdrop(ctx, G) {
  const W = PH.W, H = PH.H, cam = G.cam || 0, t = G.tick;
  // far grid
  ctx.strokeStyle = 'rgba(56,225,255,0.07)'; ctx.lineWidth = 1;
  const off = -(cam * 0.25) % 80;
  ctx.beginPath();
  for (let x = off; x < W; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 60; y < H; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // server towers silhouettes (parallax 0.5)
  const off2 = -(cam * 0.5) % 420;
  for (let x = off2 - 420; x < W + 420; x += 420) {
    ctx.fillStyle = 'rgba(20,32,70,0.9)'; ctx.fillRect(x + 40, 260, 90, 300); ctx.fillRect(x + 170, 320, 60, 240); ctx.fillRect(x + 260, 220, 110, 340);
    for (let i = 0; i < 6; i++) { const on = ((t / 20 + i + x / 100) | 0) % 3 === 0; ctx.fillStyle = on ? 'rgba(61,220,132,0.55)' : 'rgba(56,225,255,0.18)'; ctx.fillRect(x + 54, 280 + i * 40, 10, 6); ctx.fillRect(x + 280, 240 + i * 46, 14, 6); }
  }
  // drifting data bits
  ctx.fillStyle = 'rgba(56,225,255,0.35)';
  for (let i = 0; i < 26; i++) { const x = ((i * 137 + t * (0.3 + (i % 3) * 0.2) - cam * 0.15) % (W + 60)) - 30; const y = (i * 71) % (H - 120) + 20; ctx.fillRect(x, y, 3, 3); }
}

function drawLava(ctx, h, t) {
  const g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h); g.addColorStop(0, '#ff6a3d'); g.addColorStop(0.4, '#e0245e'); g.addColorStop(1, '#5a0f3a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(h.x, h.y + 40);
  for (let x = h.x; x <= h.x + h.w; x += 8) ctx.lineTo(x, h.y + Math.sin(x / 18 + t / 9) * 3);
  ctx.lineTo(h.x + h.w, h.y + h.h); ctx.lineTo(h.x, h.y + h.h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,120,0.7)';
  for (let i = 0; i < h.w / 40; i++) { const bx = h.x + 20 + i * 40, ph = (t / 30 + i) % 1; ctx.beginPath(); ctx.arc(bx, h.y + 30 - ph * 26, 3 + (1 - ph) * 3, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 10px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let x = h.x + h.w / 2; x < h.x + h.w; x += 400) ctx.fillText('⚠ VIRUS POOL', x, h.y + 22);
}

function drawPlat(ctx, q, t, p) {

function drawDoor(ctx, d, keypad) {
